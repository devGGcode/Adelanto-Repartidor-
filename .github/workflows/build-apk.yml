name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Detectar proyecto
        id: detect
        shell: bash
        run: |
          echo "== Contenido de la raiz =="
          ls -la
          DIR=""
          for d in AdelantoApp . ; do
            if [ -f "$d/settings.gradle.kts" ] && [ -f "$d/gradlew" ]; then
              DIR="$d"
              break
            fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::No se encontro settings.gradle.kts + gradlew en el repo"
            find . -name "settings.gradle.kts" -o -name "gradlew" | head -50
            exit 1
          fi
          echo "Proyecto encontrado en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        shell: bash
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: adelanto-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
